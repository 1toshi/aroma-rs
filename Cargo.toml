[package]
name = "aroma"
version = "0.1.0"
edition = "2024"
description = "Aroma: code recommendation via structural code search (Rust port of aroma-typescript)"
license = "MIT"

[lib]
name = "aroma"
path = "src/lib.rs"

[[bin]]
name = "aroma"
path = "src/main.rs"

[dependencies]
hashbrown = "=0.15.5"
memchr = "=2.7.6"
rayon = "=1.11.0"
rustc-hash = "=2.1.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false

[profile.test]
opt-level = 3
