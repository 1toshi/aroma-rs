[package]
name = "aroma-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Fast structural code search, clone detection, and recommendation engine for Rust, Python, and TypeScript/JavaScript"
license = "MIT"
readme = "README.md"
repository = "https://github.com/moorbrook/aroma-rs"
documentation = "https://docs.rs/aroma-rs"
keywords = ["code-search", "clone-detection", "ast", "aroma", "static-analysis"]
categories = ["development-tools", "command-line-utilities", "text-processing"]
exclude = [".cargo/**", ".claude/**", ".local/**", "ARENA_SYNTHESIS.md", "agent_ergonomics_audit/**", "rust-toolchain.toml"]

[lib]
name = "aroma"
path = "src/lib.rs"

[[bin]]
name = "aroma"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:serde", "dep:serde_json", "dep:ignore"]

[dependencies]
hashbrown = "0.15.5"
memchr = "2.7.6"
rayon = "1.11.0"
rustc-hash = "2.1.1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
oxc_allocator = "0.160"
oxc_ast = "0.160"
oxc_ast_visit = "0.160"
oxc_parser = "0.160"
oxc_semantic = "0.160"
oxc_span = "0.160"
oxc_syntax = "0.160"
ignore = { version = "0.4.35", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.test]
opt-level = 3

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
clone_on_ref_ptr = "warn"
format_push_string = "warn"
mem_forget = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
try_err = "warn"
unnecessary_self_imports = "warn"
verbose_file_reads = "warn"
