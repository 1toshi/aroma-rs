name: Release binaries

# Static Linux binaries (musl, no shared libraries) attached to a GitHub release, so a host can
# install `aroma` with one download and a checksum check, without Rust.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g., v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Verify tag matches Cargo.toml version
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag '$TAG' does not match Cargo.toml version 'v$VERSION'" >&2
            exit 1
          fi
      - name: Test the static build
        if: matrix.target == 'x86_64-unknown-linux-musl'
        # Through zigbuild: mimalloc's C build needs a musl C compiler, which plain cargo lacks.
        run: cargo zigbuild test --release --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Check the binary is static
        run: |
          BIN="target/${{ matrix.target }}/release/aroma"
          file "$BIN"
          file "$BIN" | grep -q "statically linked"
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN="target/${{ matrix.target }}/release/aroma"
          "$BIN" --version
          "$BIN" clones src --json > /dev/null
      - name: Package
        run: |
          NAME="aroma-${TAG}-${{ matrix.target }}"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${NAME}.tar.gz" aroma
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: aroma-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
